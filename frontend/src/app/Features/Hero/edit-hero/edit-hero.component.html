<h2>Editar Herói</h2>

<div *ngIf="successMessage" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
     background-color: green; color: white; padding: 16px; border-radius: 8px; font-size: 1.2em; z-index: 1000;">
  {{ successMessage }}
</div>

<div *ngIf="errorMessage" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
     background-color: red; color: white; padding: 16px; border-radius: 8px; font-size: 1.2em; z-index: 1000;">
  {{ errorMessage }}
</div>

<form (ngSubmit)="updateHero()">
  <label for="name">Nome real:</label>
  <input type="text" id="name" [(ngModel)]="hero.name" name="name" required>

  <label for="heroName">Nome de herói:</label>
  <input type="text" id="heroName" [(ngModel)]="hero.heroName" name="heroName" required>

  <label for="birthDate">Data de nascimento:</label>
  <input type="date" id="birthDate" [(ngModel)]="hero.birthDate" name="birthDate" required>

  <label for="height">Altura (em metros):</label>
  <input type="number" step="0.01" id="height" [(ngModel)]="hero.height" name="height" required>

  <label for="weight">Peso (em kg):</label>
  <input type="number" step="0.1" id="weight" [(ngModel)]="hero.weight" name="weight" required>

  <label>Poderes:</label>
<button type="button" (click)="togglePowers()" style="margin-bottom: 8px;">
  {{ showPowers ? 'Ocultar Poderes' : 'Selecionar Poderes' }}
</button>

<div *ngIf="showPowers" style="border: 1px solid #ccc; padding: 10px; border-radius: 6px; max-width: 300px;">
  <div *ngFor="let power of powers">
    <label>
      <input type="checkbox"
             [value]="power.id"
             (change)="onPowerToggle($event)">
      {{ power.name }}
    </label>
  </div>
</div>

  <button type="submit">Atualizar</button>
</form>
